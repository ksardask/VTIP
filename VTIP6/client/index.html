<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Форма с подгрузкой данных</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: inline-block;
      width: 100px;
    }
    .radio-group {
      margin: 20px 0;
    }
    button {
      padding: 8px 15px;
      margin-right: 10px;
      cursor: pointer;
    }
    #mediaContainer {
      margin-top: 20px;
      text-align: center;
    }
    .media-preview {
    max-width: 300px;
    max-height: 200px;
    border: 1px solid #ddd;
    margin-top: 10px;
  }
  .font-small { font-size: 12px; }
  .font-medium { font-size: 16px; }
  .font-large { font-size: 20px; }
  </style>
</head>
<body>
  <form id="userForm">
    <div class="form-group">
      <label>Имя:</label>
      <input type="text" id="name">
    </div>
    
    <div class="form-group">
      <label>Адрес:</label>
      <input type="text" id="address">
    </div>
    
    <div class="form-group">
      <label>Возраст:</label>
      <input type="text" id="age">
    </div>
    
    <div class="form-group">
      <label>Должность:</label>
      <input type="text" id="position">
    </div>
    
    <div class="radio-group">
      <label>Размер шрифта:</label>
      <input type="radio" name="fontSize" value="small" checked> Мелкий
      <input type="radio" name="fontSize" value="medium"> Средний
      <input type="radio" name="fontSize" value="large"> Крупный
    </div>
    
    <div class="buttons">
      <button type="button" id="loadJson">Загрузить данные</button>
      <button type="button" id="loadMedia">Загрузить медиа</button>
      <button type="button" id="clearForm">Очистить форму</button>
    </div>
  </form>
  
  <div id="mediaContainer"></div>
  
  <script src="script.js"></script>
</body>
</html>
